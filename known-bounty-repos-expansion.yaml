# ====================================================================
# 机会雷达 - 已知赏金仓库热区表扩充提案
# 新增 20 个仓库（2026-05-14）
# ====================================================================
#
# 分类索引:
#   Section 1: Web3 / DeFi (4)       — NomicFoundation/hardhat, MetaMask/metamask-extension, Uniswap/interface, safe-global/safe-contracts
#   Section 2: 大型开源赏金 (4)       — microsoft/vscode, electron/electron, grafana/grafana, discourse/discourse
#   Section 3: 框架与库 $bounty (6)   — directus/directus, appsmithorg/appsmith, payloadcms/payload, immich-app/immich, mermaid-js/mermaid, standardnotes/app
#   Section 4: 其他活跃 $bounty (2)   — strapi/strapi, documenso/documenso
#   Section 5: Python 活跃赏金 (4)    — huggingface/transformers, pydantic/pydantic, ApeWorX/ape, celery/celery
#
# 字段说明:
#   bounty_type:  $bounty=GitHub bounty标签/gitcoin/security=安全赏金计划
#   competition:  low=低竞争适合切入 / medium=有竞争但可获胜 / high=高手对决
#   标注 KYC 的仓库在 filter_required_kyc:true 配置下会被过滤
# ====================================================================


known_bounty_additions:

  # ==================== Section 1: Web3 / DeFi ====================

  # Hardhat - 以太坊开发环境。Immunefi 安全赏金 + 开发赏金
  # 类型: 安全赏金 (需 KYC) + GitHub issue 开发赏金 (无需 KYC)
  - repo: NomicFoundation/hardhat
    language: typescript
    labels: ["bounty", "help wanted", "bug"]
    bounty_type: "security"
    bounty_source: "immunefi"
    expected_bounty_range: [500, 50000]
    tags: ["web3", "defi", "high-value", "competitive"]
    competition: "high"
    notes: "Immunefi bug bounty $500-$50k。小型开发赏金通过 GitHub issues 发布免 KYC。大额安全赏金需 KYC。"

  # MetaMask - 最流行加密钱包。Immunefi 赏金计划
  - repo: MetaMask/metamask-extension
    language: typescript
    labels: ["bounty", "help wanted", "bug"]
    bounty_type: "security"
    bounty_source: "immunefi"
    expected_bounty_range: [1000, 50000]
    tags: ["web3", "wallet", "high-value", "high-profile"]
    competition: "high"
    notes: "Immunefi bounty $1k-$50k。TypeScript/React 前端。大型赏金需 KYC，小型 ($1k-$5k) 可 crypto。"

  # Uniswap interface - 最大 DEX 前端。Immunefi 安全赏金
  - repo: Uniswap/interface
